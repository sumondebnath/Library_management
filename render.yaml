services:
  - type: web
    name: library-management
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn libraryManagementSystem.wsgi:application"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "library-management-qonj.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://library-management-qonj.onrender.com"
      - key: DJANGO_MEDIA_ROOT
        value: "/var/data/media"
      - key: DATABASE_URL
        fromDatabase:
          name: library-management-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: EMAIL
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
    disk:
      name: media
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: library-management-db
    plan: free
