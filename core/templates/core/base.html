{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Library Management System - explore the collection, borrow books and manage your reading." />
        <title>
            {% block title %}Library Management System{% endblock %}
        </title>
        <link href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css" rel="stylesheet">
        {% block head_extra %}{% endblock %}
        <style>
            html { scroll-behavior: smooth; }
            body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }

            /* Keyboard focus visibility */
            :focus-visible { outline: 2px solid #1e3a8a; outline-offset: 2px; }

            /* ---- Buttons ---- */
            .btn {
                display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
                font-weight: 600; font-size: .875rem; line-height: 1.25rem;
                padding: .625rem 1.25rem; border-radius: .5rem;
                border: 1px solid transparent; text-align: center; white-space: nowrap;
                cursor: pointer; transition: background-color .15s ease, color .15s ease, border-color .15s ease;
            }
            .btn:disabled { opacity: .6; cursor: not-allowed; }
            .btn-primary { background-color: #1e3a8a; color: #fff; }
            .btn-primary:hover { background-color: #1e40af; }
            .btn-secondary { background-color: #fff; color: #1f2937; border-color: #cbd5e1; }
            .btn-secondary:hover { background-color: #f1f5f9; border-color: #94a3b8; }
            .btn-danger { background-color: #dc2626; color: #fff; }
            .btn-danger:hover { background-color: #b91c1c; }
            .btn-ghost { background-color: transparent; color: #1e3a8a; }
            .btn-ghost:hover { background-color: #eff6ff; }
            .btn-sm { padding: .375rem .75rem; font-size: .8125rem; border-radius: .375rem; }
            .btn-lg { padding: .75rem 1.5rem; font-size: 1rem; border-radius: .625rem; }
            .btn-block { width: 100%; }

            /* ---- Forms ---- */
            .field-label {
                display: block; font-size: .75rem; font-weight: 600; letter-spacing: .04em;
                color: #475569; margin-bottom: .375rem;
            }
            .field-input,
            input[type="text"], input[type="email"], input[type="password"], input[type="date"],
            input[type="number"], input[type="file"], select, textarea {
                display: block; width: 100%; padding: .625rem .875rem;
                font-size: .875rem; line-height: 1.5rem; color: #1f2937;
                background-color: #fff; border: 1px solid #cbd5e1; border-radius: .5rem;
                transition: border-color .15s ease, box-shadow .15s ease;
            }
            .field-input:focus, input:focus, select:focus, textarea:focus {
                outline: none; border-color: #1e3a8a; box-shadow: 0 0 0 3px rgba(30, 58, 138, .12);
            }
            .field-input[aria-invalid="true"] { border-color: #dc2626; }
            .field-input[aria-invalid="true"]:focus { box-shadow: 0 0 0 3px rgba(220, 38, 38, .12); }
            .field-error { font-size: .8125rem; color: #dc2626; margin-top: .375rem; }
            .field-help { font-size: .75rem; color: #64748b; margin-top: .25rem; }

            /* ---- Card ---- */
            .card {
                background-color: #fff; border: 1px solid #e2e8f0; border-radius: .75rem;
                box-shadow: 0 1px 3px rgba(15, 23, 42, .06);
            }

            /* ---- Badges ---- */
            .badge {
                display: inline-flex; align-items: center; padding: .125rem .625rem;
                border-radius: 9999px; font-size: .75rem; font-weight: 600; line-height: 1.25rem;
            }
            .badge-blue { background-color: #dbeafe; color: #1e40af; }
            .badge-green { background-color: #dcfce7; color: #166534; }
            .badge-amber { background-color: #fef3c7; color: #92400e; }
            .badge-red { background-color: #fee2e2; color: #b91c1c; }
            .badge-gray { background-color: #f1f5f9; color: #475569; }

            /* ---- Text clamping ---- */
            .line-clamp-2 {
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            }
        </style>
    </head>
    <body class="min-h-screen flex flex-col bg-gray-50 text-gray-900">
        {% include 'core/navber.html' %}
        <main id="main" class="flex-1 w-full">
            <div class="mx-auto w-full max-w-6xl px-4 sm:px-6 lg:px-8 py-6 sm:py-8 lg:py-10">
                {% include 'core/messages.html' %}
                {% block content %}
                    {% block body %}
                    {% endblock %}
                {% endblock %}
            </div>
        </main>
        {% include 'core/footer.html' %}
    </body>
</html>
