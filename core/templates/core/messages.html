{% for message in messages %}
<div class="alert relative flex items-start gap-3 rounded-lg border px-4 py-3 shadow-sm mb-4
    {% if 'success' in message.tags %} bg-green-50 border-green-200 text-green-800
    {% elif 'error' in message.tags %} bg-red-50 border-red-200 text-red-800
    {% elif 'warning' in message.tags %} bg-yellow-50 border-yellow-200 text-yellow-800
    {% elif 'debug' in message.tags %} bg-gray-50 border-gray-200 text-gray-700
    {% else %} bg-blue-50 border-blue-200 text-blue-800
    {% endif %}" role="alert">
    <span class="flex-shrink-0 mt-1">
        {% if 'success' in message.tags %}
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        {% elif 'error' in message.tags %}
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86l-8.1 14.06a2 2 0 001.71 3h16.2a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"></path></svg>
        {% elif 'warning' in message.tags %}
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        {% else %}
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        {% endif %}
    </span>
    <div class="flex-1">
        <p class="text-sm font-medium">{{ message }}</p>
    </div>
    <button type="button" class="alert-close flex-shrink-0 p-1 -mt-1 -mr-1 rounded-md hover:opacity-75" aria-label="Dismiss message">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
</div>
{% endfor %}

<script>
document.addEventListener('click', function (e) {
    var btn = e.target.closest('.alert-close');
    if (btn && btn.closest('.alert')) {
        btn.closest('.alert').remove();
    }
});
</script>
